# Tests, previews and renders the two report skills on every OS Claude Code
# runs on. Windows uses Git Bash on purpose: that is the shell Claude Code's
# Bash tool gives a Windows user, and the SKILL.md commands target it.
name: Report skills CI

on:
  push:
    paths:
      - plugins/tools/skills/monthly-report/**
      - plugins/tools/skills/trending-report/**
      - .github/workflows/report-skills-ci.yml
  pull_request:
    paths:
      - plugins/tools/skills/monthly-report/**
      - plugins/tools/skills/trending-report/**
      - .github/workflows/report-skills-ci.yml

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        node: [18, 22] # 18 = the floor the SKILL.md precheck promises, 22 = current LTS
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Test, preview and render each report skill
        run: |
          for skill in monthly-report trending-report; do
            echo "::group::$skill"
            (
              cd "plugins/tools/skills/$skill"
              node scripts/test-build-report.mjs
              node scripts/test-run-queries.mjs
              node scripts/test-render-pdf.mjs
              node scripts/test-review.mjs
              node scripts/build-report.mjs --demo --out "$RUNNER_TEMP/$skill-demo.html"
              test -s "$RUNNER_TEMP/$skill-demo.html"
              node scripts/preview.mjs "$RUNNER_TEMP/$skill.html"
              node scripts/render-pdf.mjs --in "$RUNNER_TEMP/$skill.html" --out "$RUNNER_TEMP/$skill.pdf"
              test -s "$RUNNER_TEMP/$skill.pdf"
            )
            echo "::endgroup::"
          done

  # The two skills ship as standalone zips, so shared files are copied, not
  # imported. Fail if a copy drifts.
  identical:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shared files match across skills
        run: |
          cd plugins/tools/skills
          for f in \
            scripts/run-queries.mjs \
            scripts/render-pdf.mjs \
            scripts/review.mjs \
            scripts/test-run-queries.mjs \
            scripts/test-render-pdf.mjs \
            scripts/test-review.mjs \
            references/frontends.dql \
            assets/chart.umd.min.js; do
            cmp "monthly-report/$f" "trending-report/$f" || { echo "::error::$f differs between monthly-report and trending-report"; exit 1; }
          done
